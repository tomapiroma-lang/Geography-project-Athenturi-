{% macro icon(n) -%}
<svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if n == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif n == 'compass' %}<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>
{%- elif n == 'shield' %}<path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/>
{%- elif n == 'users' %}<circle cx="9" cy="9" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="8" r="2.4"/><path d="M17 13.5c2.4 0 4 1.8 4 4.5"/>
{%- elif n == 'tag' %}<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>
{%- elif n == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
{%- elif n == 'phone' %}<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
{%- elif n == 'arrow' %}<path d="M5 12h14m-6-6 6 6-6 6"/>
{%- elif n == 'left' %}<path d="M19 12H5m6-6-6 6 6 6"/>
{%- elif n == 'check' %}<path d="m5 12 5 5 9-10"/>
{%- endif %}</svg>
{%- endmacro %}

{% macro badge(t) -%}<span class="badge badge-{{ t.status }}">{{ t.status_label }}</span>{%- endmacro %}

{% macro tour_card(t) %}
<article class="card">
  <a class="card-media" href="{{ url_for('tours.detail', slug=t.slug) }}" tabindex="-1" aria-hidden="true">
    <img src="{{ url_for('static', filename='img/' ~ t.image ~ '-sm.jpg') }}" alt="" loading="lazy" width="900" height="600">
    {{ badge(t) }}
  </a>
  <div class="card-body">
    <h3><a href="{{ url_for('tours.detail', slug=t.slug) }}">{{ t.title }}</a></h3>
    <p>{{ t.summary }}</p>
    <span class="card-meta">{{ icon('clock') }} {{ t.duration }}</span>
  </div>
  <div class="card-foot">
    <div class="price">€{{ t.price }} <small>ერთ ადამიანზე</small></div>
    <a class="btn btn-ghost btn-sm" href="{{ url_for('tours.detail', slug=t.slug) }}">დეტალები</a>
  </div>
</article>
{% endmacro %}
